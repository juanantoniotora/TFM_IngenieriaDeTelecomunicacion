propiedad1 = relleno desde el fichero "application.properites" -> "propiedad1"
propiedad2 = relleno desde el fichero "application.properties" -> "propiedad2"

# --- H2 Database ---
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=juanantonio
spring.datasource.password=1234

# --- Consola H2 ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# Configuracion de puerto del servidor HTTP
server.port=9090

# Importacion del fichero "sql.yml"
spring.config.import=classpath:sql.yml

